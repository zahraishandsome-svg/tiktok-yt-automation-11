# TikTok to YouTube Channel Pairs
#
# ch11 — onboarded 2026-07-26. Own repo + own GCP project under
# notalysialys@gmail.com (standard policy: every channel fully de-correlated).
#
# This channel is DIFFERENT from the others: it releases one multi-part LONGFORM
# series in order, one part every 3 days, with hand-written SEO titles and
# descriptions instead of the raw TikTok caption.

channels:
  - id: channel_11
    tiktok_username: "lysialys_"
    youtube_channel_name: "alysia"
    google_credentials_file: "credentials/channel_11_client_secret.json"
    oauth_token_file: "tokens/channel_11_token.json"
    videos_per_day: 1
    description_footer: ""
    default_tags:
      - amputee
      - limb loss
      - prosthetic leg
      - hip disarticulation
      - amputee story
      - air force
      - disability
      - survivor story
    youtube_category_id: "22"
    enabled: true
    max_retry_days: 7
    # Longform storytelling — these are 6-12 minute videos, never Shorts.
    shorts_max_seconds: 0

    # sequence: release these TikTok IDs in this exact order, one at a time.
    upload_mode: sequence
    video_sequence:
      - "7639811890914299166"   # Part 1 — 11:55
      - "7639812036066577694"   # Part 2 — 10:01
      - "7639812157781200159"   # Part 3 —  6:02

    # The cron fires daily; this gate releases the next part only once 3 whole
    # days have passed since the last upload. No every-3-days cron needed.
    min_days_between_uploads: 3

    max_download_candidates: 5

    # Hand-written SEO title + description per video (overrides the TikTok caption).
    # All three share the same detailed description; only the part marker differs.
    video_meta:
      "7639811890914299166":
        title: "How I Lost My Entire Right Leg | Part 1: The Air Force Crash"
        description: |
          In 2023, a rescue vehicle crash on a US Air Force base changed my
          life in a matter of seconds. This series is the full story of that
          day and everything that came after — told by me, in my own words.

          I'm a hip disarticulation amputee. My entire right leg was removed at
          the hip joint, which is one of the rarest levels of limb loss there
          is. Very few amputees have this amputation, and almost nobody talks
          about what it actually looks like to live with it — the emergency
          surgeries, the months in hospital, phantom pain, and relearning how
          to sit, drive and walk again with a prosthesis.

          📺 The full 3-part series:
          Part 1 — the crash, the emergency surgeries, and waking up as an amputee
          Part 2 — recovery, rehab, and rebuilding a life
          Part 3 — where I am today, and what I'd tell anyone starting this journey

          ⚠️ Trigger warning: this series contains graphic images and detailed
          descriptions of a traumatic injury and medical procedures.

          ▶ You're watching Part 1 of 3. Part 2 comes out in 3 days.

          📄 Sources referenced in this series:
          Air Force JAG investigation report:
          https://www.afjag.af.mil/LinkClick.aspx?fileticket=BlCD_qfZsHg%3d&portalid=77
          Full investigation documents:
          https://drive.google.com/file/d/1GCIzj1XQCNpl25sb-C24MqFSWjc6ei_l/view?usp=drive_link
          Task & Purpose news coverage:
          https://taskandpurpose.com/news/air-force-rescue-vehicle-crash/

          Thank you so much for listening to my story. It's been the craziest
          road, but I'm so grateful to be here 💛

          #amputee #limbloss #prosthetic #airforce #hipdisarticulation
          #amputeestory #disability #prostheticleg #survivorstory

